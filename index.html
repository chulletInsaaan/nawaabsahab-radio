<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry's Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="top-left">
        <div id="live-time">12:00 am</div>
        <div id="live-date">MONDAY, 1 JANUARY - IST</div>
        <div class="listeners">● <span id="listener-count">13 & 87</span> listening</div>
    </div>

    <div class="player-container">
        <img id="thumbnail" src="https://via.placeholder.com/100" alt="Album Art">
        
        <div class="player-details">
            <!-- ADD THIS DROPDOWN -->
            <select id="playlist-selector">
                <option value="Coocking pc">Coocking pc</option>
                <option value="M">M</option>
                <option value="Cousins">Cousins</option>
                <option value="Collecting">Collecting</option>
                <option value="Creat">Creat</option>
                <option value="Dec">Dec</option>
                <option value="D">D</option>
                
            </select>
            <h2 id="song-title">Song Title</h2>
            <p id="song-artist">Singer Name</p>
            
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="total-time">0:00</span>
            </div>

            <div class="controls">
                <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                <button id="play-pause-btn" class="play-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn"><i class="fas fa-step-forward"></i></button>
                
                <i class="fas fa-volume-up volume-icon"></i>
                <input type="range" id="volume-slider" value="100" min="0" max="100">
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="youtube-player"></div>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="playlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
